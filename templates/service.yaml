apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flaresolverr.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "flaresolverr.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8191
      targetPort: http
    - name: metrics
      port: 8192
      targetPort: metrics
