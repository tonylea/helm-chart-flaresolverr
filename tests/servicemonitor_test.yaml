suite: ServiceMonitor
release:
  name: flaresolverr
templates:
  - templates/servicemonitor.yaml
tests:
  - it: scrapes the metrics port of the Service
    asserts:
      - equal:
          path: spec.endpoints
          value:
            - port: metrics
              interval: 30s
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: flaresolverr
            app.kubernetes.io/instance: flaresolverr

  - it: renders nothing when disabled
    set:
      serviceMonitor.enabled: false
    asserts:
      - hasDocuments:
          count: 0
